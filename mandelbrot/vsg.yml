# Configuration for VHDL Style Guide (VSG, https://vhdl-style-guide.readthedocs.io/),
# for the VHDL files of the mandelbrot design (src, sim, and formal).
#
# Usage, in the mandelbrot folder:
#    vsg -c vsg.yml -ap -f $(git ls-files '*.vhd' ':!src/vga/font_pkg.vhd' \
#                                 ':!src/hdmi' ':!src/keyboard')
# (add --fix to let VSG fix what it can). Without -ap, VSG stops after the
# first phase that has a violation, so e.g. the naming rules are only checked
# once all the formatting is right. src/vga/font_pkg.vhd is left out, because
# it is generated by font/gen_font_pkg.py, and src/hdmi and src/keyboard are
# left out, because they are copied unchanged from the C64MEGA65 core.
#
# The formatting rules are the ones used throughout this folder: 3 spaces
# indent, aligned colons, "<=", and comments, "in " and "out" port modes, no
# parenthesis around an if condition, and so on.
#
# The naming rules are the ones already used throughout this folder, which
# use prefixes for labels, generics, and constants, and suffixes for the rest:
#   | Kind            | Convention                                  | Example     |
#   | --------------- | ------------------------------------------- | ----------- |
#   | Port            | lower_snake_case, suffix _i or _o           | clk_i       |
#   | Generic         | UPPER_SNAKE_CASE, prefix G_                 | G_NUM_ROWS  |
#   | Constant        | UPPER_SNAKE_CASE, prefix C_                 | C_ADDR_BITS |
#   | Type, subtype   | lower_snake_case, suffix _t                 | state_t     |
#   | Array type      | lower_snake_case, suffix _vector            | int_vector  |
#   | Enum literal    | UPPER_SNAKE_CASE, a state has suffix _ST    | IDLE_ST     |
#   | Signal          | lower_snake_case                            | res_valid_r |
#   | Variable        | lower_snake_case, suffix _v                 | addr_v      |
#   | Process label   | prefix p_                                   | p_cnt       |
#   | Instance label  | prefix i_                                   | i_main      |
#   | Generate label  | prefix gen_                                 | gen_job     |
#   | Package         | suffix _pkg                                 | video_pkg   |
#   | Architecture    | rtl, structural, simulation (testbench), or |             |
#   |                 | stub (a stub for the formal verification)   |             |
#
# Not checked:
#   - The _ST suffix on states cannot be told apart from other enumerations.
#   - The suffixes on signals (_r for a register, _s for a combinational
#     signal, _d for a delayed copy) are not used for all signals, so they are
#     not checked.
#   - The alignment of ":=" and "<=" in sequential code (see process_400).

rule:

  # --- Global ----------------------------------------------------------------

  global:
    indent_size: 3

  # --- File layout ------------------------------------------------------------

  # A blank line separates the use clauses of different libraries
  library_007:
    style: no_blank_line_unless_different_library

  # --- Naming -----------------------------------------------------------------

  generic_020:
    disable: false
    prefixes: ['G_']

  generic_007:
    case: upper

  generic_map_002:
    case: upper

  constant_015:
    disable: false
    prefixes: ['C_']

  constant_004:
    case: upper

  type_600:
    disable: false
    suffixes: ['_t', '_vector']

  subtype_600:
    disable: false
    suffixes: ['_t']

  type_500:
    case: upper

  variable_600:
    disable: false
    suffixes: ['_v']

  port_025:
    disable: false

  process_036:
    disable: false
    prefixes: ['p_']

  instantiation_601:
    disable: false
    prefixes: ['i_']

  generate_017:
    disable: false
    prefixes: ['gen_']

  package_016:
    disable: false

  package_body_600:
    disable: false

  architecture_025:
    disable: false
    names: ['rtl', 'structural', 'simulation', 'stub']

  # Xilinx primitives (BUFG, MMCME2_ADV, ODDR) are written in upper case, like
  # in the Xilinx libraries. They are the only components, so the name of a
  # component is upper case.
  instantiation_009:
    case: upper

  # The formal of a port map is written like the port in the entity, i.e. in
  # upper case for a Xilinx primitive, and VSG has no rule that allows both
  port_map_002:
    disable: true

  # E.g. 100.0E6
  exponent_500:
    case: upper

  # --- Formatting -------------------------------------------------------------

  # Aim for lines under 100 columns. A target, not a hard limit.
  length_001:
    length: 100
    severity: Warning

  # The use clauses are at column 0, not indented under the library clause
  # (see the indent section at the end of this file)

  # Port modes are written "in " and "out", with one space after "in" for
  # alignment
  port_007:
    spaces_after: 2

  port_008:
    spaces_after: 1

  # No spaces around "-" in a width expression, e.g. G_DATA_SIZE-1, which VSG
  # cannot tell apart from other arithmetic
  whitespace_011:
    disable: true

  bit_string_literal_500:
    case: upper

  # when ... else chains may be written on one line
  conditional_waveforms_001:
    allow_single_line: 'yes'

  conditional_waveforms_100:
    disable: true

  conditional_waveforms_102:
    disable: true

  # The colons of the generics and of the ports are aligned separately, each
  # in one column for the whole clause, also across blank lines and comments
  entity_017:
    blank_line_ends_group: 'no'
    comment_line_ends_group: 'no'

  # Likewise, the colons of a record are in one column for the whole record
  type_400:
    comment_line_ends_group: 'no'

  instantiation_010:
    blank_line_ends_group: 'no'
    comment_line_ends_group: 'no'

  # Elsewhere, colons, "<=", and comments are aligned within each group of
  # lines separated by a blank line or a comment line, in one column for all
  # the kinds of lines in the group, e.g. both signals and constants
  architecture_026:
    compact_alignment: 'no'

  architecture_027:
    compact_alignment: 'no'

  generate_401:
    compact_alignment: 'no'

  process_033:
    compact_alignment: 'no'

  process_034:
    compact_alignment: 'no'

  concurrent_006:
    compact_alignment: 'no'

  entity_020:
    compact_alignment: 'no'

  package_401:
    compact_alignment: 'no'

  concurrent_008:
    compact_alignment: 'no'

  process_035:
    blank_line_ends_group: 'yes'
    comment_line_ends_group: 'yes'

  # In sequential code, ":=" and "<=" are aligned separately, i.e. the
  # variable assignments of a group in one column, and the signal assignments
  # in another, which VSG cannot express (it aligns them in one column)
  process_400:
    disable: true

  subprogram_body_400:
    disable: true

  # The identifiers after "signal", "constant", "type", etc. are not aligned,
  # i.e. there is one space after the keyword
  architecture_029:
    disable: true

  process_031:
    disable: true

  generate_400:
    disable: true

  package_019:
    disable: true

  # The := of an initializer is not aligned
  declarative_part_400:
    disable: true

  # The elements of a multi-line constant are indented one level from the
  # constant, also when it is not an array, and the closing parenthesis ends
  # the last line, e.g.
  #    constant C_SEG_TABLE : seg_table_t := (
  #       "0111111",  -- 0
  #       ...
  #       "1101111"); -- 9
  constant_012:
    align_left: 'yes'
    align_paren: 'no'

  constant_014:
    align_left: 'yes'
    align_paren: 'no'

  # Tables (e.g. of test cases, of video modes, or of the font) are aligned in
  # columns, with numbers aligned to the right, so these rules, which want
  # exactly one space, are disabled
  constant_100:
    disable: true

  constant_400:
    disable: true

  element_association_101:
    disable: true

  generic_map_007:
    disable: true

  whitespace_005:
    disable: true

  case_005:
    disable: true

  # A table of one-line case alternatives, e.g. when 0 => res(i) := ...;
  case_012:
    disable: true

  # Continuation lines are aligned by the author
  entity_018:
    disable: true

  sequential_004:
    disable: true

  concurrent_009:
    disable: true

  function_008:
    disable: true

  sequential_008:
    disable: true

  variable_assignment_004:
    disable: true

  variable_assignment_007:
    disable: true

  # The parameters of a subprogram header continue under the opening
  # parenthesis, which these rules (indent based) cannot express
  procedure_004:
    disable: true

  procedure_410:
    disable: true

  # The literals of a multi-line enumeration type continue under the opening
  # parenthesis, e.g.
  #    type state_t is (IDLE_ST, ZOOM_ST, ...,
  #                     PAN_ST, CLAMP_ST);
  type_005:
    disable: true

  type_008:
    disable: true

  type_009:
    disable: true

  # The condition of an if statement that does not fit on one line continues
  # on the next lines, aligned after "if ", and "then" is then on a line of
  # its own, aligned with "if", e.g.
  #    if res_valid_s = '1' and res_last_r = '1' and
  #       res_start_r = '0' and res_ack_i = '1'
  #    then
  if_009:
    disable: true

  if_036:
    disable: true

  # Blank lines are placed by the author, so none of these boundaries require
  # or forbid one
  subtype_201:
    disable: true

  subtype_202:
    disable: true

  subprogram_body_201:
    disable: true

  subprogram_body_202:
    disable: true

  subprogram_body_203:
    disable: true

  subprogram_body_204:
    disable: true

  case_007:
    disable: true

  case_009:
    disable: true

  case_010:
    disable: true

  case_200:
    disable: true

  process_011:
    disable: true

  process_026:
    disable: true

  process_027:
    disable: true

  loop_statement_200:
    disable: true

  loop_statement_201:
    disable: true

  loop_statement_202:
    disable: true

  loop_statement_203:
    disable: true

  function_006:
    disable: true

  procedure_200:
    disable: true

  instantiation_019:
    disable: true

  if_006:
    disable: true

  if_008:
    disable: true

  if_030:
    disable: true

  type_010:
    disable: true

  type_011:
    disable: true

  case_201:
    disable: true

  generate_004:
    disable: true

  if_007:
    disable: true

  if_010:
    disable: true

  subprogram_body_205:
    disable: true

  if_031:
    disable: true

  # A process or an instance directly in a generate statement follows the
  # generate line, without a blank line
  process_015:
    disable: true

  instantiation_004:
    disable: true

  # A comment above a block statement belongs to it, like for a process
  block_200:
    style: no_code

  whitespace_200:
    blank_lines_allowed: 2

  # --- Coding idioms ----------------------------------------------------------

  # Direct entity instantiation, without an architecture identifier. A Xilinx
  # primitive is instantiated as a component, but without the optional
  # "component" keyword. VSG cannot tell the two apart, so instantiation_034
  # (which wants an entity instantiation) is disabled.
  instantiation_033:
    action: remove

  instantiation_034:
    disable: true

  instantiation_036:
    action: remove

  # process (clk_i), without the optional "is"
  process_012:
    action: remove

  # No parenthesis around an if condition
  if_002:
    parenthesis: remove

  # Compact subprogram headers
  function_019:
    disable: true

  procedure_013:
    disable: true

  constant_016:
    disable: true

  function_100:
    disable: true

  procedure_100:
    disable: true

  process_022:
    style: no_blank_line

  process_023:
    style: no_blank_line

  # A comment at the end of a line in a port map or a generic map explains a
  # literal value, e.g. CLKINSEL => '1', -- Select CLKIN1
  port_map_010:
    disable: true

  # Initial values on signals, ports, and variables are used where the
  # power-up state matters, e.g. for simulation. VSG wants every one removed.
  signal_007:
    disable: true

  port_012:
    disable: true

  variable_007:
    disable: true

  # "-- pragma synthesis_off" and "-- pragma synthesis_on" are written at
  # column 0, so they are impossible to miss
  pragma_300:
    disable: true

  # A comment is indented like the code it describes. VSG's comment_010
  # indents it like the line below it, which is wrong for a comment at the end
  # of a block, e.g. just before "end loop".
  comment_010:
    disable: true

# The use clauses are at column 0, like the library clause
indent:
  tokens:
    use_clause:
      keyword:
        token: current
        after: current
        token_after_library_clause: current
        token_if_no_matching_library_clause: current
